<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary responsive layout review</title><style>body{margin:0;background:#dce2d5;font:14px system-ui;color:#153b32}header{display:flex;align-items:center;gap:20px;padding:16px 24px;background:#f6f4ec}select{font:inherit;padding:8px}main{padding:20px;display:grid;place-items:start center}iframe{width:390px;height:790px;border:1px solid #859778;background:#f6f4ec;max-width:100%}</style></head><body><header><strong>Responsive layout review</strong><label>Width <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option></select></label><label>Page <select id="page"><option value="./">Portfolio</option><option value="./demo/">Dashboard</option></select></label></header><main><iframe id="preview" title="Responsive portfolio preview" src="./"></iframe></main><script>const frame=document.querySelector('#preview');document.querySelector('#width').addEventListener('change',e=>frame.style.width=e.target.value+'px');document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);</script></body></html>
